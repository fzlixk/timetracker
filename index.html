<!doctype html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF2FF; --surface:#FFFFFF; --surface2:#E4EAFF; --ink:#1F2547; --muted:#6A7199;
  --line:#CFD8FA; --primary:#5C6CFF; --primary-ink:#FFFFFF; --danger:#E5484D; --live:#20C997;
  --shadow:0 16px 32px -18px rgba(54,70,210,.5);
  --display:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1230; --surface:#1A1E46; --surface2:#262B5E; --ink:#EEF0FF; --muted:#A3AAD8;
    --line:#2F3573; --primary:#8A97FF; --primary-ink:#0F1236; --danger:#FF7A7E;
    --shadow:0 16px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1230; --surface:#1A1E46; --surface2:#262B5E; --ink:#EEF0FF; --muted:#A3AAD8;
  --line:#2F3573; --primary:#8A97FF; --primary-ink:#0F1236; --danger:#FF7A7E;
  --shadow:0 16px 32px -18px rgba(0,0,0,.8);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.muted{color:var(--muted)}
.page{max-width:600px;margin:0 auto;padding:22px 18px 130px;display:flex;flex-direction:column;gap:20px}
.enter{animation:enter .45s cubic-bezier(.22,1,.36,1) both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}

/* bubble surface */
.bub{background-color:var(--c);color:var(--on);
  background-image:radial-gradient(circle at 28% 22%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 46%);
  transition:background-color .35s ease,color .35s ease,transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease}
.press{transition:transform .25s cubic-bezier(.34,1.56,.64,1),background-color .35s ease,box-shadow .3s ease}
.press:active{transform:scale(.94)}
@media (hover:hover){.press:not(:disabled):hover{transform:translateY(-2px)}.press:not(:disabled):active{transform:scale(.94)}}

.card{background:var(--surface);border-radius:34px;padding:22px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.top h1{font-size:30px}
.label{font-size:14px;color:var(--muted);font-weight:700}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:17px;box-shadow:0 12px 24px -12px var(--primary)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none}
.btn.stop{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.link{background:none;color:var(--danger);box-shadow:none;padding:12px 18px}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.block{width:100%}
.field{width:100%;padding:15px 22px;border-radius:999px;border:2.5px solid transparent;background:var(--surface2);color:var(--ink);font:inherit;font-weight:700}
.field::placeholder{color:var(--muted);opacity:.8}
.field:focus{border-color:var(--primary);outline:none}
.err{color:var(--danger);font-weight:700;min-height:1.4em;font-size:14px;padding-left:8px}

/* header avatar + chips */
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 10px 18px -10px var(--c)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;font-weight:800;font-size:17px;box-shadow:0 12px 20px -14px var(--c)}
.pop{animation:popin .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes popin{from{transform:scale(.4);opacity:0}}

/* today card */
.today-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-family:var(--display);font-weight:600;font-size:44px;line-height:1.05;margin-top:2px}
.streak-pill{padding:8px 16px;border-radius:999px;background:var(--surface2);font-weight:800;font-size:15px;white-space:nowrap}
.goal-track{height:16px;border-radius:999px;background:var(--surface2);margin:18px 0 10px;overflow:hidden}
.goal-fill{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .6s cubic-bezier(.22,1,.36,1);min-width:16px}
.goal-text{font-size:14px}

/* subjects */
.sec-title{font-size:22px;margin-bottom:12px}
.subjects{display:flex;flex-wrap:wrap;gap:12px}
.subj{display:inline-flex;align-items:center;border-radius:999px;box-shadow:0 12px 20px -14px var(--c);transition:box-shadow .3s ease,transform .3s cubic-bezier(.34,1.56,.64,1)}
.subj.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}
.subj-main{display:flex;flex-direction:column;align-items:flex-start;padding:10px 6px 10px 20px;text-align:left;border-radius:999px 0 0 999px}
.subj-name{font-weight:800;font-size:17px;line-height:1.15}
.subj-time{font-size:13px;font-weight:700;opacity:.8}
.subj-edit{width:38px;height:38px;margin:0 8px 0 4px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28)}
.subj-edit:hover{background:rgba(255,255,255,.45)}
.addb{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;border:2.5px dashed var(--line);color:var(--primary);font-weight:800;font-size:17px;background:transparent}
.addb:hover{border-color:var(--primary)}
.addb.big{width:100%;padding:40px 20px;border-radius:38px;font-family:var(--display);font-size:22px;font-weight:500}

/* timer orb */
.timer-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 20px 26px;text-align:center}
.orb{position:relative;width:min(250px,66vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  box-shadow:0 30px 46px -26px var(--c),inset 0 -14px 28px rgba(0,0,0,.08),inset 0 8px 18px rgba(255,255,255,.18)}
.orb:disabled{opacity:.5}
.orb.swap{animation:popin .5s cubic-bezier(.34,1.56,.64,1) both}
.orb-in{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:80%}
.orb-sub{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.orb.run{animation:breathe 4.5s ease-in-out infinite}
.orb.run::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);animation:ripple 2.6s ease-out infinite;pointer-events:none}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.4);opacity:0}}
.clock{font-family:var(--body);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.status{font-weight:700;color:var(--muted)}
.rise{position:fixed;border-radius:50%;pointer-events:none;z-index:60;animation:floatup 1.1s cubic-bezier(.22,1,.36,1) forwards}
@keyframes floatup{from{transform:translate(0,0) scale(.4);opacity:.95}to{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(var(--n),1fr);position:relative;background:var(--surface2);border-radius:999px;padding:5px}
.seg-thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/var(--n));border-radius:999px;background:var(--surface);box-shadow:0 8px 16px -10px rgba(40,50,160,.5);transform:translateX(calc(var(--i)*100%));transition:transform .45s cubic-bezier(.34,1.3,.64,1)}
.seg button{position:relative;z-index:1;padding:10px 6px;border-radius:999px;font-weight:800;font-size:15px;color:var(--muted);transition:color .25s}
.seg button[aria-selected="true"]{color:var(--ink)}

/* nav */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 28px));z-index:20;
  display:grid;grid-template-columns:repeat(var(--n),1fr);padding:6px;border-radius:999px;background:var(--surface);box-shadow:0 18px 36px -14px rgba(40,50,160,.55)}
.nav .thumb{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n));border-radius:999px;background:var(--primary);transform:translateX(calc(var(--i)*100%));transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
.nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted);transition:color .3s}
.nav button[aria-current="page"]{color:var(--primary-ink)}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;padding:18px}
.tile .emo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface2)}
.tile .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:210px;margin-top:14px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.col .val{font-size:11px;font-weight:800;color:var(--muted);min-height:14px;white-space:nowrap}
.plot{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{width:100%;max-width:36px;min-height:12px;border-radius:999px;background:var(--surface2);display:flex;flex-direction:column-reverse;overflow:hidden;transform-origin:bottom;animation:grow .8s cubic-bezier(.34,1.25,.64,1) both;animation-delay:calc(var(--k)*55ms)}
.bar span{display:block;width:100%;min-height:0}
@keyframes grow{from{transform:scaleY(.05);opacity:.4}}
.col .dl{font-size:13px;font-weight:800;color:var(--muted)}
.col.now .dl{color:var(--primary)}
.brk{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.brk-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.brk-name{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}
.brk-name i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.brk-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{grid-column:1/-1;height:16px;border-radius:999px;background:var(--surface2);overflow:hidden}
.fill{display:block;height:100%;border-radius:999px;background:var(--c);width:calc(var(--w)*1%);min-width:16px;animation:fillw .9s cubic-bezier(.22,1,.36,1) both}
@keyframes fillw{from{width:0}}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* leaderboard */
.livepill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:800;font-size:14px;box-shadow:var(--shadow)}
.livepill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.livepill.live i{background:var(--live);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(32,201,151,.6)}100%{box-shadow:0 0 0 10px rgba(32,201,151,0)}}
.lblist{display:flex;flex-direction:column;gap:12px}
.lbrow{display:grid;grid-template-columns:34px 48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 20px 12px 14px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow)}
.lbrow.me{box-shadow:0 0 0 3px var(--primary),var(--shadow)}
.rank{text-align:center;font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted)}
.rank.medal{font-size:24px}
.who{min-width:0}
.nm{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;min-width:0}
.nm>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.you{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--primary);color:var(--primary-ink);flex:none}
.sub{font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .ld{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;animation:pulse2 1.8s ease-out infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.val{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{text-align:center;font-size:14px;padding:0 12px}
.lock-ico{font-size:64px;line-height:1}

/* profile */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.av.xl{width:112px;height:112px;font-size:56px;box-shadow:0 22px 32px -18px var(--c)}
.hero .field{max-width:320px;text-align:center;font-family:var(--display);font-size:22px;font-weight:500}
.group{display:flex;flex-direction:column;gap:14px}
.group h2{font-size:20px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:380px}
.sw{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 14px -10px var(--c)}
.sw[aria-checked="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c)}
.sw svg{animation:popin .35s cubic-bezier(.34,1.56,.64,1) both}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.em{aspect-ratio:1;border-radius:50%;background:var(--surface2);font-size:22px;display:grid;place-items:center}
.em[aria-pressed="true"]{box-shadow:0 0 0 3px var(--primary);background:var(--surface)}
.qrow{display:flex;flex-wrap:wrap;gap:10px}
.qchip{padding:10px 18px;border-radius:999px;background:var(--surface2);font-weight:800}
.qchip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{border-radius:28px;padding:14px 8px;background:var(--surface2);text-align:center;font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:center;opacity:.55;filter:grayscale(1)}
.badge .be{font-size:30px;line-height:1.1}
.badge b{font-weight:800;font-size:14px}
.badge.on{opacity:1;filter:none;background:var(--surface);box-shadow:var(--shadow)}
.sync{font-size:14px}

/* account / sync */
.authbox{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:var(--surface2)}
.authrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.authstatus{display:flex;align-items:center;gap:9px;font-weight:800}
.authstatus i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.authstatus.ok i{background:var(--live);box-shadow:0 0 0 5px color-mix(in srgb,var(--live) 16%,transparent)}
.smallbtn{padding:11px 16px;border-radius:999px;background:var(--surface);font-weight:800;box-shadow:0 8px 16px -12px rgba(40,50,160,.5)}
.smallbtn.primary{background:var(--primary);color:var(--primary-ink)}
.authhint{font-size:13px;color:var(--muted);font-weight:700}
.authactions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.authactions .smallbtn{width:100%;text-align:center}
.accountname{font-family:var(--display);font-size:18px;font-weight:600}

/* goal slider */
.gs{display:flex;flex-direction:column;gap:10px;align-items:center}
.goal-val{text-align:center;color:var(--primary)}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:22px;border-radius:999px;margin:6px 0;cursor:pointer;
  background:linear-gradient(90deg,var(--primary) var(--p),var(--surface2) var(--p))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;border:4px solid var(--surface);
  background:radial-gradient(circle at 30% 25%,#fff,var(--primary) 70%);box-shadow:0 8px 16px -6px var(--primary);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.slider:active::-webkit-slider-thumb{transform:scale(1.2)}
.slider::-moz-range-thumb{width:30px;height:30px;border-radius:50%;border:4px solid var(--surface);
  background:radial-gradient(circle at 30% 25%,#fff,var(--primary) 70%);box-shadow:0 8px 16px -6px var(--primary)}
.gs-ticks{display:flex;justify-content:space-between;width:100%;font-size:13px;color:var(--muted);font-weight:800}

/* onboarding */
.onboard{padding-top:34px;gap:22px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:24px;font-weight:600}
.logo{position:relative;width:38px;height:38px;border-radius:50%;--c:var(--primary);--on:#fff;box-shadow:0 10px 18px -10px var(--primary)}
.logo::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;right:-5px;top:-3px;background:var(--primary);opacity:.45}
.ob-title{font-size:40px;line-height:1.08}
.ob-sub{max-width:44ch}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,18,48,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s both}
.backdrop.closing{animation:fadeout .22s both}
.sheet{width:min(100%,520px);max-height:92%;overflow:auto;background:var(--surface);border-radius:34px 34px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;animation:rise .5s cubic-bezier(.34,1.25,.64,1) both}
.backdrop.closing .sheet{animation:drop .22s ease-in both}
.sheet h2{font-size:26px}
.sheet .actions{display:flex;gap:10px;flex-wrap:wrap}
.sheet .actions .btn{flex:1}
@media (min-width:640px){.backdrop{align-items:center}.sheet{border-radius:34px;padding-bottom:26px}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes rise{from{transform:translateY(60px) scale(.96);opacity:0}}
@keyframes drop{to{transform:translateY(40px) scale(.97);opacity:0}}
.preview{display:flex;justify-content:center;padding:6px 0}

/* toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%) scale(.9);opacity:0;pointer-events:none;z-index:80;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:800;text-align:center;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .25s}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}

@media (max-width:420px){
  .ob-title{font-size:34px}
  .big{font-size:38px}
  .emojis{grid-template-columns:repeat(8,1fr);gap:5px}
  .em{font-size:19px}
  .lbrow{gap:9px;padding-right:16px}
  .val{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<div id="app">
  <main id="view"></main>
  <nav id="nav" class="nav" aria-label="Main" hidden></nav>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

/* ---------- constants & tiny helpers ---------- */
var PALETTE=[['#FF6B81','Coral'],['#FF9F43','Orange'],['#FFD43B','Sunshine'],['#94D82D','Lime'],['#20C997','Mint'],
             ['#4DABF7','Sky'],['#5C7CFA','Blue'],['#9775FA','Violet'],['#F06595','Pink'],['#6C7A9C','Slate']];
var COLORS=PALETTE.map(function(p){return p[0];});

var BOARD_OPEN_HOUR=20;
var MAX_SESSION=8*3600;
var LS_KEY='timetracker.state.v1';
var INK='#1F2547';
var TABS=[['home','Home','home'],['stats','Stats','chart'],['board','Board','trophy'],['me','Profile','user']];

var $=function(s,r){return (r||document).querySelector(s);};
var pad=function(n){return String(n).padStart(2,'0');};
var str=function(v,n){return typeof v==='string'?v.slice(0,n):'';};
var num=function(v){return (typeof v==='number'&&isFinite(v)&&v>0)?v:0;};
var reduceMotion=function(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;};
function safeColor(c){return (typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c))?c:null;}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function h(tag,props){
  var el=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      var v=props[k];
      if(v==null) return;
      if(k==='class') el.className=v;
      else if(k==='vars'){Object.keys(v).forEach(function(n){el.style.setProperty(n,v[n]);});}
      else if(k==='style') el.setAttribute('style',v);
      else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
      else if(typeof v==='boolean' && k.indexOf('aria-')!==0){ if(v) el.setAttribute(k,''); }
      else el.setAttribute(k,String(v));
    });
  }
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){
      var kid=kids[j];
      if(kid==null||kid===false) continue;
      el.append(kid.nodeType?kid:document.createTextNode(String(kid)));
    }
  }
  return el;
}

function icon(name,size){
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width',size||22);s.setAttribute('height',size||22);
  s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2.4');
  s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');
  s.innerHTML=ICONS[name];return s;
}

function lum(hex){
  var n=parseInt(hex.slice(1),16);
  var c=[(n>>16)&255,(n>>8)&255,n&255].map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
function inkOn(hex){
  var L=lum(hex);
  return (1.05/(L+0.05))>=((L+0.05)/(lum(INK)+0.05))?'#FFFFFF':INK;
}
function bubVars(color){return {'--c':color,'--on':inkOn(color)};}

/* ---------- time helpers ---------- */
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function parseKey(k){return new Date(k+'T00:00:00');}
function weekStartKey(d){var x=new Date(d||new Date());x.setDate(x.getDate()-((x.getDay()+6)%7));return dkey(x);}
function fmt(s){
  s=Math.max(0,Math.floor(s));var m=Math.floor(s/60);
  if(m<60) return m+'m';
  var hh=Math.floor(m/60),mm=m%60;
  return mm?hh+'h '+mm+'m':hh+'h';
}
function fmtClock(s){s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
function shortFmt(s){
  if(s<60) return '';
  var m=Math.floor(s/60);
  if(m<60) return m+'m';
  return (s/3600).toFixed(1).replace(/\.0$/,'')+'h';
}

/* leaderboard lock: closed until 8pm local time, open until midnight, repeats daily */
function boardOpen(){return new Date().getHours()>=BOARD_OPEN_HOUR;}
function untilOpen(){
  var n=new Date(),t=new Date(n);t.setHours(BOARD_OPEN_HOUR,0,0,0);
  return fmtClock((t-n)/1000);
}

/* ---------- state ---------- */
function defaults(){
  return {v:1,onboarded:false,profile:{name:'',emoji:EMOJIS[0],color:COLORS[6],goal:120},subjects:[],log:{},timer:null,selected:null,updatedAt:0};
}
function normalize(o){
  var d=defaults();
  if(!o||typeof o!=='object') return d;
  var p=(o.profile&&typeof o.profile==='object')?o.profile:{};
  d.onboarded=!!o.onboarded;
  d.profile={name:str(p.name,20),emoji:str(p.emoji,8)||d.profile.emoji,color:safeColor(p.color)||d.profile.color,
    goal:(typeof p.goal==='number'&&p.goal>=GOAL_MIN&&p.goal<=480)?Math.round(p.goal):120};
  d.subjects=(Array.isArray(o.subjects)?o.subjects:[]).filter(function(s){return s&&typeof s.id==='string'&&typeof s.name==='string';})
    .map(function(s){return {id:s.id.slice(0,40),name:s.name.slice(0,24),color:safeColor(s.color)||COLORS[9],archived:!!s.archived};});
  var log={};
  if(o.log&&typeof o.log==='object'){
    Object.keys(o.log).forEach(function(k){
      var v=o.log[k];
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!v||typeof v!=='object') return;
      var e={},any=false;
      Object.keys(v).forEach(function(sid){var n=num(v[sid]);if(n){e[sid]=Math.round(n);any=true;}});
      if(any) log[k]=e;
    });
  }
  d.log=log;
  d.timer=(o.timer&&typeof o.timer.sid==='string'&&typeof o.timer.start==='number')?{sid:o.timer.sid,start:o.timer.start}:null;
  d.selected=typeof o.selected==='string'?o.selected:null;
  d.updatedAt=num(o.updatedAt);
  return d;
}
function loadLocal(){
  try{var raw=localStorage.getItem(LS_KEY);if(raw) return normalize(JSON.parse(raw));}catch(e){}
  return defaults();
}
function localSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}

var S=loadLocal();
var tab='home',lbPeriod=0,breakRange=0,lbTick=0;
var popOrb=false,popId=null,popAvatar=false;
var UID=null,DB=null,canWrite=true,viewerName='',isAnonymous=true,authEmail='',authUsername='';
var lbDocs=new Map();
var liveState='offline',syncState='local',authBusy=false;

/* ---------- selectors / computed ---------- */
function activeSubjects(){return S.subjects.filter(function(s){return !s.archived;});}
function subjById(id){return S.subjects.find(function(s){return s.id===id&&!s.archived;})||null;}
function anySubj(id){return S.subjects.find(function(s){return s.id===id;})||null;}
function ensureSelected(){
  var a=activeSubjects();
  if(!subjById(S.selected)) S.selected=a.length?a[0].id:null;
}
function nextColor(){
  var used=activeSubjects().map(function(s){return s.color;});
  return COLORS.find(function(c){return used.indexOf(c)<0;})||COLORS[Math.floor(Math.random()*COLORS.length)];
}
function daySecs(k){var d=S.log[k],t=0;if(!d) return 0;Object.keys(d).forEach(function(s){t+=d[s];});return t;}
function liveSecs(){return S.timer?Math.max(0,Math.min((Date.now()-S.timer.start)/1000,MAX_SESSION)):0;}
function todaySecs(){return daySecs(dkey())+liveSecs();}
function weekSecs(){
  var wk=weekStartKey(),t=0;
  Object.keys(S.log).forEach(function(k){if(k>=wk) t+=daySecs(k);});
  return t+liveSecs();
}
function totalSecs(){var t=0;Object.keys(S.log).forEach(function(k){t+=daySecs(k);});return t+liveSecs();}
function hasDay(k,tk){return (daySecs(k)+(k===tk?liveSecs():0))>=60;}
function streak(){
  var d=new Date(),tk=dkey(d),n=0;
  if(!hasDay(tk,tk)) d=addDays(d,-1);
  while(n<3650&&hasDay(dkey(d),tk)){n++;d=addDays(d,-1);}
  return n;
}
function bestStreak(){
  var ks=Object.keys(S.log).filter(function(k){return daySecs(k)>=60;}).sort(),best=0,cur=0,prev=null;
  ks.forEach(function(k){
    if(prev&&dkey(addDays(parseKey(prev),1))===k) cur++; else cur=1;
    if(cur>best) best=cur;prev=k;
  });
  return Math.max(best,streak());
}
function subjectSecsToday(id){
  var d=S.log[dkey()];
  return d&&d[id]?d[id]:0;
}
function addSecs(sid,secs){
  var k=dkey();
  if(!S.log[k]) S.log[k]={};
  S.log[k][sid]=(S.log[k][sid]||0)+Math.round(secs);
}
function dayMap(k){
  var m={},d=S.log[k];
  if(d) Object.keys(d).forEach(function(s){m[s]=d[s];});
  if(k===dkey()&&S.timer){m[S.timer.sid]=(m[S.timer.sid]||0)+liveSecs();}
  return m;
}
function goalText(t){
  var g=S.profile.goal*60;
  return t>=g?'Daily goal reached. Nice work!':fmt(g-t)+' left to reach your '+fmt(g)+' goal';
}

/* ---------- saving + sync ---------- */
var saveTimer=null,saving=false,again=false,lastState='',lastLb='';
function touch(immediate){S.updatedAt=Date.now();scheduleSave(immediate);}
function scheduleSave(immediate){
  localSave();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(remoteSave,immediate?60:900);
}
function accountConnected(){return !!(DB&&UID&&!isAnonymous&&authUsername);}
function redirectUrl(){return window.location.origin+window.location.pathname;}
function cleanUsername(v){return String(v||'').trim().toLowerCase();}
function validUsername(v){return /^[a-z0-9_]{3,20}$/.test(v);}
function usernameEmail(v){return cleanUsername(v)+'@accounts.ttrevise.app';}
function lbDoc(){
  var days={},keys=Object.keys(S.log).sort().slice(-35),total=0;
  keys.forEach(function(k){days[k]=daySecs(k);});
  Object.keys(S.log).forEach(function(k){total+=daySecs(k);});
  var sub=S.timer?anySubj(S.timer.sid):null;
  return {name:(S.profile.name||'Student').slice(0,20),emoji:S.profile.emoji,color:S.profile.color,days:days,total:total,
          studying:sub?{name:sub.name.slice(0,24),color:sub.color,since:S.timer.start}:null};
}
function remoteSave(){
  if(!DB||!UID||!canWrite||!S.onboarded) return Promise.resolve();
  if(saving){again=true;return Promise.resolve();}
  saving=true;
  var snapshot=JSON.parse(JSON.stringify(S));
  var st=JSON.stringify(Object.assign({},snapshot,{updatedAt:0}));
  var lb=lbDoc(),lbs=JSON.stringify(lb);
  return (async function(){
    try{
      /* Permanent accounts sync their full revision state across devices. */
      if(accountConnected() && st!==lastState){
        var r1=await sb.from('tt_state').upsert({user_id:UID,state:snapshot,updated_at:new Date().toISOString()});
        if(r1.error) throw r1.error;
        lastState=st;
      }

      /* Both anonymous and permanent users publish a leaderboard entry. */
      if(lbs!==lastLb){
        var r2=await sb.from('tt_board').upsert({user_id:UID,name:lb.name,emoji:lb.emoji,color:lb.color,
          days:lb.days,total:Math.round(lb.total),studying:lb.studying,updated_at:new Date().toISOString()});
        if(r2.error) throw r2.error;
        lastLb=lbs;
      }
      setSync('synced');
    }catch(e){
      console.error('Timetracker sync error:',e);
      setSync(e&&e.code==='42501'?'readonly':'error');
      if(e&&e.code==='42501') canWrite=false;
    }
    saving=false;
    if(again){again=false;remoteSave();}
  })();
}
function setSync(s){
  syncState=s;
  var el=$('#syncNote');if(el) el.textContent=syncText();
  var as=$('#authStatusText');
  if(as){as.textContent=accountStatusText();as.className='authstatus'+(accountConnected()?' ok':'');}
  var ae=$('#authEmail');if(ae) ae.textContent=accountConnected()?authEmail:'';
  var ah=$('#authHint');if(ah) ah.textContent=accountConnected()?'Your leaderboard entry and revision history sync between devices.':'Your data is currently local to this device. Connect an email to make it follow you to other devices.';
  var n=$('#lbNote');if(n&&tab==='board') renderLbList();
}
function syncText(){
  if(!DB||!UID) return 'Saved on this device only.';
  if(isAnonymous) return 'Your leaderboard entry is shared live. Create an account to sync your full progress across devices.';
  if(syncState==='readonly'||!canWrite) return 'Your account is connected, but this account cannot write to the leaderboard. Check the Supabase policies.';
  if(syncState==='error') return 'Could not sync just now. Your local copy is safe and we will retry.';
  return 'Synced. Your progress follows you across devices.';
}
function accountStatusText(){
  if(!DB||!UID) return 'Local only';
  if(isAnonymous) return 'Local session';
  return 'Synced account';
}
function setLive(s){
  liveState=s;
  var p=$('#livepill');
  if(p){p.className='livepill'+(s==='live'?' live':'');p.lastChild.textContent=s==='live'?'Live':'Offline';}
}
async function loadRemoteState(){
  if(!accountConnected()) return;
  try{
    var r=await sb.from('tt_state').select('state,updated_at').eq('user_id',UID).maybeSingle();
    if(r.data&&r.data.state){
      var remote=normalize(r.data.state);
      if(remote.updatedAt>S.updatedAt){
        S=remote;
        localSave();
      }
    }
  }catch(e){
    console.error('Timetracker state load error:',e);
  }
}
async function initRemote(){
  if(!sb) return;
  try{
    var s=await sb.auth.getSession(),session=s.data&&s.data.session;
    if(!session){
      var a=await sb.auth.signInAnonymously();
      if(a.error) throw a.error;
      session=a.data.session;
    }
    UID=session.user.id;
    DB=sb;
    isAnonymous=!!session.user.is_anonymous;
    authEmail=session.user.email||'';
    authUsername=cleanUsername(session.user.user_metadata&&session.user.user_metadata.username||'');
    canWrite=true;
  }catch(e){
    console.error('Timetracker auth error:',e);
    setSync('error');
    return;
  }

  await loadRemoteState();
  await loadBoard();

  sb.channel('tt_board_live')
    .on('postgres_changes',{event:'*',schema:'public',table:'tt_board'},function(){loadBoard();})
    .subscribe(function(st){setLive(st==='SUBSCRIBED'?'live':'offline');});

  sb.auth.onAuthStateChange(function(event,session){
    if(!session) return;
    setTimeout(async function(){
      var oldUID=UID;
      var wasAnonymous=isAnonymous;

      UID=session.user.id;
      DB=sb;
      isAnonymous=!!session.user.is_anonymous;
      authEmail=session.user.email||'';
      authUsername=cleanUsername(session.user.user_metadata&&session.user.user_metadata.username||'');
      canWrite=true;

      if(oldUID!==UID){
        lastState='';
        lastLb='';
        await loadRemoteState();
        await loadBoard();
        if(S.onboarded) scheduleSave(true);
        render();
        if(accountConnected()) toast('Signed in. Your progress is synced.');
      }else if(wasAnonymous && !isAnonymous){
        lastState='';
        lastLb='';
        if(S.onboarded) scheduleSave(true);
        render();
        toast('Account connected. Your progress is now synced.');
      }

      setSync(accountConnected()?'synced':'local');
    },0);
  });

  render();
  setSync(accountConnected()?'synced':'local');
  if(accountConnected()&&S.onboarded) scheduleSave(true);
}
async function loadBoard(){
  if(!sb) return;
  var r=await sb.from('tt_board').select('*').order('updated_at',{ascending:false}).limit(200);
  if(r.error||!r.data) return;
  var m=new Map();
  r.data.forEach(function(row){
    if(!row.user_id) return;
    m.set(row.user_id,{name:row.name,emoji:row.emoji,color:row.color,days:row.days,total:row.total,studying:row.studying});
  });
  lbDocs=m;
  if(tab==='board'&&S.onboarded&&boardOpen()) renderLbList();
}

/* ---------- account linking / sign-in ---------- */
function openSyncSheet(mode){
  mode=mode||'menu';
  if(mode==='menu'){
    openSheet(function(sheet){
      sheet.append(
        h('h2',null,'Sync across devices'),
        h('p',{class:'muted'},'Create an account on this device, then use the same username and password on your other device.'),
        h('div',{class:'authactions'},
          h('button',{class:'smallbtn primary press',onclick:function(){closeSheet();setTimeout(function(){openSyncSheet('create');},230);}},'Create account'),
          h('button',{class:'smallbtn press',onclick:function(){closeSheet();setTimeout(function(){openSyncSheet('login');},230);}},'Log in')
        ),
        h('p',{class:'authhint'},'Your password is handled by Supabase Auth. Your username is what other people see on the leaderboard.')
      );
    });
    return;
  }

  openSheet(function(sheet){
    var isCreate=mode==='create';
    var username=h('input',{class:'field',type:'text',maxlength:20,placeholder:'Username',autocomplete:'username','aria-label':'Username',spellcheck:'false'});
    var password=h('input',{class:'field',type:'password',maxlength:72,placeholder:'Password',autocomplete:isCreate?'new-password':'current-password','aria-label':'Password'});
    var confirm=isCreate?h('input',{class:'field',type:'password',maxlength:72,placeholder:'Confirm password',autocomplete:'new-password','aria-label':'Confirm password'}):null;
    var err=h('p',{class:'err',role:'alert'});

    function formUsername(){
      var u=cleanUsername(username.value);
      if(!validUsername(u)){
        err.textContent='Username must be 3-20 characters using letters, numbers or _.';
        username.focus();return null;
      }
      if(String(password.value).length<6){
        err.textContent='Password must be at least 6 characters.';
        password.focus();return null;
      }
      if(isCreate&&password.value!==confirm.value){
        err.textContent='The passwords do not match.';
        confirm.focus();return null;
      }
      return u;
    }

    var switcher=h('button',{class:'btn ghost press',onclick:function(){
      closeSheet();
      setTimeout(function(){openSyncSheet(isCreate?'login':'create');},230);
    }},isCreate?'I already have an account':'Create a new account');

    var submit=h('button',{class:'btn press',onclick:async function(){
      var u=formUsername();
      if(!u||authBusy) return;
      authBusy=true;submit.disabled=true;switcher.disabled=true;err.textContent='';

      try{
        if(isCreate){
          if(!isAnonymous){
            err.textContent='This device is already signed into an account.';
            return;
          }

          var r=await sb.auth.updateUser({
            email:usernameEmail(u),
            password:password.value,
            data:{username:u}
          });
          if(r.error) throw r.error;
          if(!r.data||!r.data.user) throw new Error('Account creation did not return a user.');

          UID=r.data.user.id;
          DB=sb;
          isAnonymous=!!r.data.user.is_anonymous;
          authEmail=r.data.user.email||usernameEmail(u);
          authUsername=u;
          canWrite=true;
          lastState='';lastLb='';

          if(S.onboarded) await remoteSave();
          render();
          closeSheet();
          toast('Account created. Your progress is now synced.');
        }else{
          var r2=await sb.auth.signInWithPassword({
            email:usernameEmail(u),
            password:password.value
          });
          if(r2.error) throw r2.error;

          var session=r2.data.session;
          if(!session) throw new Error('No session was returned.');

          UID=session.user.id;
          DB=sb;
          isAnonymous=!!session.user.is_anonymous;
          authEmail=session.user.email||usernameEmail(u);
          authUsername=cleanUsername(session.user.user_metadata&&session.user.user_metadata.username||u);
          canWrite=true;
          lastState='';lastLb='';

          await loadRemoteState();
          await loadBoard();
          render();
          closeSheet();
          toast('Logged in as @'+authUsername+'.');
        }
      }catch(e){
        console.error('Username/password auth error:',e);
        var msg=e&&e.message?e.message:'Could not complete that request.';
        if(/invalid login credentials/i.test(msg)) msg='Incorrect username or password.';
        else if(/already registered|already exists|duplicate/i.test(msg)) msg='That username is already in use.';
        else if(/email.*confirm|confirm.*email/i.test(msg)) msg='Turn off Confirm email in Supabase Auth for this version.';
        err.textContent=msg;
      }finally{
        authBusy=false;submit.disabled=false;switcher.disabled=false;
      }
    }},isCreate?'Create account':'Log in');

    sheet.append(
      h('h2',null,isCreate?'Create account':'Log in'),
      h('p',{class:'muted'},isCreate
        ?'Choose a username and password. Your current Timetracker data stays on this account.'
        :'Use the same username and password you used on your other device.'),
      username,password,confirm,err,submit,switcher,
      h('p',{class:'authhint'},'For this version, Supabase Auth must have Confirm email turned off. The internal auth email is not displayed publicly.')
    );
  });
}


/* ---------- toast, sheets, bubbles ---------- */
var toastT;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2500);
}
var lastFocus=null;
function openSheet(build){
  closeSheet(true);
  lastFocus=document.activeElement;
  var sheet=h('div',{class:'sheet',role:'dialog','aria-modal':'true'});
  var bd=h('div',{class:'backdrop',onclick:function(e){if(e.target===bd) closeSheet();}},sheet);
  build(sheet);
  $('#overlay').append(bd);
  var f=sheet.querySelector('input,button');
  if(f) setTimeout(function(){f.focus({preventScroll:true});},60);
}
function closeSheet(instant){

function burst(rect,color){
  if(reduceMotion()||!rect) return;
  var cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  for(var i=0;i<12;i++){
    var size=8+Math.random()*16,ang=Math.random()*Math.PI*2,dist=70+Math.random()*90;
    var b=h('i',{class:'rise',vars:{'--dx':(Math.cos(ang)*dist)+'px','--dy':(Math.sin(ang)*dist-60)+'px'}});
    b.style.width=b.style.height=size+'px';
    b.style.left=(cx-size/2)+'px';b.style.top=(cy-size/2)+'px';
    b.style.background='radial-gradient(circle at 30% 25%,rgba(255,255,255,.8),'+color+' 60%)';
    document.body.append(b);
    setTimeout(function(el){return function(){el.remove();};}(b),1200);
  }
}

/* leaderboard */
function myEntry(){
  var tk=dkey(),wk=weekStartKey(),week=0,total=0;
  Object.keys(S.log).forEach(function(k){var s=daySecs(k);total+=s;if(k>=wk&&k<=tk) week+=s;});
  var sub=S.timer?anySubj(S.timer.sid):null;
  return {id:UID||'local',me:true,name:S.profile.name||'You',emoji:S.profile.emoji,color:S.profile.color,
    today:daySecs(tk),week:week,total:total,studying:sub?{name:sub.name,color:sub.color,since:S.timer.start}:null};
}
function parseLb(id,d){
  var tk=dkey(),wk=weekStartKey(),today=0,week=0,days=(d&&typeof d.days==='object'&&d.days)?d.days:{};
  Object.keys(days).forEach(function(k){
    var v=num(days[k]);if(!v) return;
    if(k===tk) today+=v;
    if(k>=wk&&k<=tk) week+=v;
  });
  var s=d&&d.studying,st=null;
  if(s&&typeof s.since==='number'&&Date.now()-s.since<12*3600*1000&&s.since<=Date.now()+60000){
    st={name:str(s.name,24)||'a subject',color:safeColor(s.color)||COLORS[6],since:s.since};
  }
  return {id:id,me:false,name:str(d.name,20)||'Student',emoji:str(d.emoji,8)||'🙂',color:safeColor(d.color)||COLORS[6],
    today:today,week:week,total:num(d.total),studying:st};
}

function renderLbList(){
  var box=$('#lbList');if(!box) return;
  var list=[];
  lbDocs.forEach(function(d,id){if(id!==UID) list.push(parseLb(id,d));});
  list.push(myEntry());
  list.sort(function(a,b){return entryValue(b)-entryValue(a)||a.name.localeCompare(b.name);});
  list=list.slice(0,50);

  box.querySelectorAll('[data-id]').forEach(function(el){prev.set(el.dataset.id,el.getBoundingClientRect().top);});
  box.replaceChildren.apply(box,list.map(function(e,i){return lbRow(e,i+1);}));
  updateLive();
  if(!reduceMotion()){
    box.querySelectorAll('[data-id]').forEach(function(el,i){
      var p=prev.get(el.dataset.id);
      if(p==null){
        el.animate([{opacity:0,transform:'scale(.9) translateY(8px)'},{opacity:1,transform:'none'}],{duration:420,delay:Math.min(i,8)*45,easing:'cubic-bezier(.34,1.4,.64,1)',fill:'backwards'});
      }else{
        var dy=p-el.getBoundingClientRect().top;
        if(Math.abs(dy)>1) el.animate([{transform:'translateY('+dy+'px)'},{transform:'none'}],{duration:500,easing:'cubic-bezier(.34,1.25,.64,1)'});
      }
    });
  }
  var note=$('#lbNote');
  if(note){
    if(!DB) note.textContent='The live board is unavailable right now. Your time is still saved locally.';
    else if(isAnonymous) note.textContent='Your leaderboard entry is shared live. Create an account in Profile to make your full progress follow you across devices.';
    else if(!canWrite) note.textContent='Your account is connected, but Supabase is not allowing board writes. Check the table policies.';
    else if(list.length<2) note.textContent='You are the only synced person here so far. Get someone else to join the leaderboard.';
    else note.textContent='';
  }
}

/* profile */
function viewProfile(){
  var root=h('div',{class:'page'});
  var pop=popAvatar;popAvatar=false;
  var av=h('div',{class:'av xl bub'+(pop?' pop':''),vars:bubVars(S.profile.color)},S.profile.emoji);
  var name=h('input',{class:'field',type:'text',maxlength:20,value:S.profile.name,placeholder:'Your name','aria-label':'Your name',autocomplete:'off'});
  name.addEventListener('input',function(){S.profile.name=name.value.slice(0,20);touch();});
  root.append(h('div',{class:'hero'},av,name,h('p',{class:'muted'},'This is how you appear on the leaderboard.')));

  root.append(h('section',{class:'card group'},h('h2',null,'Your look'),
    h('div',{class:'emojis',role:'group','aria-label':'Avatar'},EMOJIS.map(function(e){
      return h('button',{class:'em press','aria-pressed':e===S.profile.emoji,'aria-label':'Avatar '+e,onclick:function(){S.profile.emoji=e;popAvatar=true;touch();render();}},e);
    })),
    h('div',{class:'swatches',role:'radiogroup','aria-label':'Profile colour'},PALETTE.map(function(p){
      var on=p[0]===S.profile.color;
      return h('button',{class:'sw bub press',role:'radio','aria-checked':on,'aria-label':p[1],vars:bubVars(p[0]),onclick:function(){S.profile.color=p[0];popAvatar=true;touch();render();}},on?icon('check',22):null);
    }))));

  root.append(h('section',{class:'card group'},h('h2',null,'Daily goal'),goalSlider()));

  var total=totalSecs(),best=bestStreak();
  var badges=[['🌱','First step','Log your first session',total>0],['⏳','One hour','1 hour revised',total>=3600],
    ['📚','Ten hours','10 hours revised',total>=36000],['🏔️','Fifty hours','50 hours revised',total>=180000],
    ['🔥','3 day streak','3 days in a row',best>=3],['⚡','7 day streak','7 days in a row',best>=7]];
  root.append(h('section',{class:'card group'},h('h2',null,'Badges'),
    h('div',{class:'badges'},badges.map(function(b){
      return h('div',{class:'badge'+(b[3]?' on':'')},h('span',{class:'be'},b[0]),h('b',null,b[1]),h('span',{class:'muted'},b[2]));
    }))));

  root.append(h('section',{class:'card group'},h('h2',null,'Sync across devices'),
    h('div',{class:'authbox'},
      h('div',{class:'authrow'},
        h('div',{class:'authstatus'+(accountConnected()?' ok':''),id:'authStatusText'},h('i'),accountStatusText()),
        accountConnected()?h('span',{class:'label accountname',id:'authEmail'},'@'+authUsername):null
      ),
      accountConnected()?h('button',{class:'smallbtn press',onclick:async function(){
        try{await sb.auth.signOut();}catch(e){}
        location.reload();
      }},'Switch account'):h('div',{class:'authactions'},
        h('button',{class:'smallbtn primary press',onclick:function(){openSyncSheet('create');}},'Create account'),
        h('button',{class:'smallbtn press',onclick:function(){openSyncSheet('login');}},'Log in')
      ),
      h('p',{class:'authhint',id:'authHint'},accountConnected()?'Your leaderboard entry and revision history syncs to this account.':'Create or log into an account to use the same Timetracker identity on another device.')
    )));

  root.append(h('section',{class:'card group'},h('h2',null,'Your data'),
    h('p',{class:'muted sync',id:'syncNote'},syncText()),
    h('button',{class:'btn link press',style:'align-self:flex-start',onclick:openResetSheet},'Delete all my data')));
  return root;
}
function openResetSheet(){
  openSheet(function(sheet){
    sheet.append(h('h2',null,'Delete everything?'),
      h('p',{class:'muted'},'This removes your subjects, revision history and leaderboard entry. It cannot be undone.'),
      h('div',{class:'actions'},
        h('button',{class:'btn ghost press',onclick:function(){closeSheet();}},'Keep my data'),
        h('button',{class:'btn stop press',onclick:async function(){
          closeSheet();
          S=defaults();localSave();tab='home';lastState='';lastLb='';
          if(DB&&UID&&canWrite){
            try{await sb.from('tt_state').delete().eq('user_id',UID);await sb.from('tt_board').delete().eq('user_id',UID);}catch(e){}
          }
          render(true);toast('All data deleted');
        }},'Delete everything')));
  });
}

/* ---------- boot ---------- */
buildNav();
render();
initRemote();
})();
</script>
