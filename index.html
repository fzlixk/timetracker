<style>
:root{color-scheme:light;--bg:#EEF2FF;--surface:#FFF;--surface2:#E4EAFF;--ink:#1F2547;--muted:#6A7199;--line:#CFD8FA;--primary:#5C6CFF;--primary-ink:#FFF;--danger:#E5484D;--live:#20C997;--shadow:0 16px 32px -18px rgba(54,70,210,.5);--display:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;--body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}

.page{max-width:600px;margin:0 auto;padding:22px 18px 130px;display:flex;flex-direction:column;gap:20px}.enter{animation:enter .45s cubic-bezier(.22,1,.36,1) both}@keyframes enter{from{opacity:0;transform:translateY(12px)}}
.bub{background-color:var(--c);color:var(--on);background-image:radial-gradient(circle at 28% 22%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 46%);transition:background-color .35s,color .35s,transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}.press{transition:transform .25s cubic-bezier(.34,1.56,.64,1),background-color .35s,box-shadow .3s}.press:active{transform:scale(.94)}@media(hover:hover){.press:not(:disabled):hover{transform:translateY(-2px)}.press:not(:disabled):active{transform:scale(.94)}}
.card{background:var(--surface);border-radius:34px;padding:22px;box-shadow:var(--shadow)}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.top h1{font-size:30px}.label{font-size:14px;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:800;font-size:17px;box-shadow:0 12px 24px -12px var(--primary)}.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none}.btn.stop{background:var(--ink);color:var(--bg);box-shadow:none}.btn.link{background:none;color:var(--danger);box-shadow:none;padding:12px 18px}.btn:disabled{opacity:.45;box-shadow:none}.btn.block{width:100%}
.field{width:100%;padding:15px 22px;border-radius:999px;border:2.5px solid transparent;background:var(--surface2);color:var(--ink);font:inherit;font-weight:700}.field::placeholder{color:var(--muted);opacity:.8}.field:focus{border-color:var(--primary);outline:none}.err{color:var(--danger);font-weight:700;min-height:1.4em;font-size:14px;padding-left:8px}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 10px 18px -10px var(--c)}.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;font-weight:800;font-size:17px;box-shadow:0 12px 20px -14px var(--c)}.pop{animation:popin .55s cubic-bezier(.34,1.56,.64,1) both}@keyframes popin{from{transform:scale(.4);opacity:0}}
.today-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.big{font-family:var(--display);font-weight:600;font-size:44px;line-height:1.05;margin-top:2px}.streak-pill{padding:8px 16px;border-radius:999px;background:var(--surface2);font-weight:800;font-size:15px;white-space:nowrap}.goal-track{height:16px;border-radius:999px;background:var(--surface2);margin:18px 0 10px;overflow:hidden}.goal-fill{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .6s cubic-bezier(.22,1,.36,1);min-width:16px}.goal-text{font-size:14px}
.lvl-card{display:flex;flex-direction:column;gap:14px}.lvl-top{display:flex;align-items:center;gap:14px}.lvl-badge{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:600;font-size:26px;background:var(--primary);color:var(--primary-ink);box-shadow:0 12px 20px -12px var(--primary)}.lvl-info{flex:1;min-width:0}.lvl-title{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15}.xp-text{font-size:14px}.xp-track{height:16px;border-radius:999px;background:var(--surface2);overflow:hidden}.xp-fill{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .6s cubic-bezier(.22,1,.36,1);min-width:16px}.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.sec-title{font-size:22px;margin-bottom:12px}.subjects{display:flex;flex-wrap:wrap;gap:12px}.subj{display:inline-flex;align-items:center;border-radius:999px;box-shadow:0 12px 20px -14px var(--c);transition:box-shadow .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}.subj.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}.subj-main{display:flex;flex-direction:column;align-items:flex-start;padding:10px 6px 10px 20px;text-align:left;border-radius:999px 0 0 999px}.subj-name{font-weight:800;font-size:17px;line-height:1.15}.subj-time{font-size:13px;font-weight:700;opacity:.8}.subj-edit{width:38px;height:38px;margin:0 8px 0 4px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28)}.addb{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;border:2.5px dashed var(--line);color:var(--primary);font-weight:800;font-size:17px;background:transparent}.addb:hover{border-color:var(--primary)}.addb.big{width:100%;padding:40px 20px;border-radius:38px;font-family:var(--display);font-size:22px;font-weight:500}
.timer-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 20px 26px;text-align:center}.orb{position:relative;width:min(250px,66vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;box-shadow:0 30px 46px -26px var(--c),inset 0 -14px 28px rgba(0,0,0,.08),inset 0 8px 18px rgba(255,255,255,.18)}.orb:disabled{opacity:.5}.orb.swap{animation:popin .5s cubic-bezier(.34,1.56,.64,1) both}.orb-in{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:80%}.orb-sub{font-weight:800;font-size:17px;overflow-wrap:anywhere}.orb.run{animation:breathe 4.5s ease-in-out infinite}.orb.run::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);animation:ripple 2.6s ease-out infinite;pointer-events:none}@keyframes breathe{50%{transform:scale(1.04)}}@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.4);opacity:0}}.clock{font-family:var(--body);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums}.status{font-weight:700;color:var(--muted)}.rise{position:fixed;border-radius:50%;pointer-events:none;z-index:60;animation:floatup 1.1s cubic-bezier(.22,1,.36,1) forwards}@keyframes floatup{from{transform:translate(0,0) scale(.4);opacity:.95}to{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.timer-card.running{gap:22px;padding:46px 20px 36px;min-height:600px;justify-content:center;background-color:color-mix(in srgb,var(--c) 13%,var(--surface));animation:expandCard .65s cubic-bezier(.22,1,.36,1) both}.timer-card.running .orb{width:min(300px,70vw)}.timer-card.running .clock{font-size:52px}.timer-card.running .orb-sub{font-size:19px}.timer-card.shrink{animation:shrinkCard .5s cubic-bezier(.22,1,.36,1) both}@keyframes expandCard{from{min-height:0;padding-top:30px;padding-bottom:26px;gap:18px;background-color:var(--surface)}}@keyframes shrinkCard{from{min-height:600px;padding-top:46px;padding-bottom:36px;gap:22px}}
.run-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px}.rs{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow)}.rs b{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}.rs-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:34px}.rs-chip{padding:7px 14px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 2.5px var(--c);font-weight:800;font-size:14px}.rs-hint{font-size:14px}
.seg{display:grid;grid-template-columns:repeat(var(--n),1fr);position:relative;background:var(--surface2);border-radius:999px;padding:5px}.seg-thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/var(--n));border-radius:999px;background:var(--surface);box-shadow:0 8px 16px -10px rgba(40,50,160,.5);transform:translateX(calc(var(--i)*100%));transition:transform .45s cubic-bezier(.34,1.3,.64,1)}.seg button{position:relative;z-index:1;padding:10px 6px;border-radius:999px;font-weight:800;font-size:15px;color:var(--muted);transition:color .25s}.seg button[aria-selected="true"]{color:var(--ink)}
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 28px));z-index:20;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:6px;border-radius:999px;background:var(--surface);box-shadow:0 18px 36px -14px rgba(40,50,160,.55)}.nav .thumb{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n));border-radius:999px;background:var(--primary);transform:translateX(calc(var(--i)*100%));transition:transform .5s cubic-bezier(.34,1.3,.64,1)}.nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted);transition:color .3s}.nav button[aria-current="page"]{color:var(--primary-ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{display:flex;flex-direction:column;gap:10px;padding:18px}.tile .emo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface2)}.tile .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05}.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:210px;margin-top:14px}.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}.col .val{font-size:11px;font-weight:800;color:var(--muted);min-height:14px;white-space:nowrap}.plot{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:100%;max-width:36px;min-height:12px;border-radius:999px;background:var(--surface2);display:flex;flex-direction:column-reverse;overflow:hidden;transform-origin:bottom;animation:grow .8s cubic-bezier(.34,1.25,.64,1) both;animation-delay:calc(var(--k)*55ms)}.bar span{display:block;width:100%;min-height:0}@keyframes grow{from{transform:scaleY(.05);opacity:.4}}.col .dl{font-size:13px;font-weight:800;color:var(--muted)}.col.now .dl{color:var(--primary)}.brk{display:flex;flex-direction:column;gap:16px;margin-top:18px}.brk-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}.brk-name{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}.brk-name i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}.brk-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{grid-column:1/-1;height:16px;border-radius:999px;background:var(--surface2);overflow:hidden}.fill{display:block;height:100%;border-radius:999px;background:var(--c);width:calc(var(--w)*1%);min-width:16px;animation:fillw .9s cubic-bezier(.22,1,.36,1) both}@keyframes fillw{from{width:0}}.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.livepill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:800;font-size:14px;box-shadow:var(--shadow)}.livepill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}.livepill.live i{background:var(--live);animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(32,201,151,.6)}100%{box-shadow:0 0 0 10px rgba(32,201,151,0)}}
.lblist{display:flex;flex-direction:column;gap:12px}.lbrow{display:grid;grid-template-columns:34px 48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 20px 12px 14px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow)}.lbrow.me{box-shadow:0 0 0 3px var(--primary),var(--shadow)}.rank{text-align:center;font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted)}.rank.medal{font-size:24px}.who{min-width:0}.nm{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;min-width:0}.nm>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.you{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--primary);color:var(--primary-ink);flex:none}.status-dot{position:relative;width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}.status-dot.revising{background:var(--live);box-shadow:0 0 0 0 rgba(32,201,151,.5);animation:statusPulse 1.8s ease-out infinite}.status-dot.idle{background:#9AA0B2}.status-dot.recent{background:#FFD43B}.status-dot.recent::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--surface);top:-3px;left:4px}@keyframes statusPulse{0%{box-shadow:0 0 0 0 rgba(32,201,151,.55)}100%{box-shadow:0 0 0 8px rgba(32,201,151,0)}}.val{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}.note{text-align:center;font-size:14px;padding:0 12px}.lock-ico{font-size:64px;line-height:1}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}.av.xl{width:112px;height:112px;font-size:56px;box-shadow:0 22px 32px -18px var(--c)}.hero .field{max-width:320px;text-align:center;font-family:var(--display);font-size:22px;font-weight:500}.group{display:flex;flex-direction:column;gap:14px}.group h2{font-size:20px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:380px}.sw{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 14px -10px var(--c)}.sw[aria-checked="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c)}.sw svg{animation:popin .35s cubic-bezier(.34,1.56,.64,1) both}.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.em{aspect-ratio:1;border-radius:50%;background:var(--surface2);font-size:22px;display:grid;place-items:center}.em[aria-pressed="true"]{box-shadow:0 0 0 3px var(--primary);background:var(--surface)}.qrow{display:flex;flex-wrap:wrap;gap:10px}.qchip{padding:10px 18px;border-radius:999px;background:var(--surface2);font-weight:800}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.badge{border-radius:28px;padding:14px 8px;background:var(--surface2);text-align:center;font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:center;opacity:.55;filter:grayscale(1)}.badge .be{font-size:30px;line-height:1.1}.badge b{font-weight:800;font-size:14px}.badge.on{opacity:1;filter:none;background:var(--surface);box-shadow:var(--shadow)}.sync{font-size:14px}
.authbox{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:var(--surface2)}.authrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.authstatus{display:flex;align-items:center;gap:9px;font-weight:800}.authstatus i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.authstatus.ok i{background:var(--live);box-shadow:0 0 0 5px color-mix(in srgb,var(--live) 16%,transparent)}.smallbtn{padding:11px 16px;border-radius:999px;background:var(--surface);font-weight:800;box-shadow:0 8px 16px -12px rgba(40,50,160,.5)}.smallbtn.primary{background:var(--primary);color:var(--primary-ink)}.authhint{font-size:13px;color:var(--muted);font-weight:700}.authactions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.authactions .smallbtn{width:100%;text-align:center}.accountname{font-family:var(--display);font-size:18px;font-weight:600}
.gs{display:flex;flex-direction:column;gap:10px;align-items:center}.goal-val{text-align:center;color:var(--primary)}.slider{-webkit-appearance:none;appearance:none;width:100%;height:22px;border-radius:999px;margin:6px 0;cursor:pointer;background:linear-gradient(90deg,var(--primary) var(--p),var(--surface2) var(--p))}.slider::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;border:4px solid var(--surface);background:radial-gradient(circle at 30% 25%,#fff,var(--primary) 70%);box-shadow:0 8px 16px -6px var(--primary)}.slider::-moz-range-thumb{width:30px;height:30px;border-radius:50%;border:4px solid var(--surface);background:radial-gradient(circle at 30% 25%,#fff,var(--primary) 70%);box-shadow:0 8px 16px -6px var(--primary)}.gs-ticks{display:flex;justify-content:space-between;width:100%;font-size:13px;color:var(--muted);font-weight:800}
.onboard{padding-top:34px;gap:22px}.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:24px;font-weight:600}.logo{width:44px;height:44px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface2);box-shadow:0 10px 18px -10px rgba(92,108,255,.65)}.logo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}.ob-title{font-size:40px;line-height:1.08}.ob-sub{max-width:44ch}
.backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,18,48,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s both}.backdrop.closing{animation:fadeout .22s both}.sheet{width:min(100%,520px);max-height:92%;overflow:auto;background:var(--surface);border-radius:34px 34px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;animation:rise .5s cubic-bezier(.34,1.25,.64,1) both}.backdrop.closing .sheet{animation:drop .22s ease-in both}.sheet h2{font-size:26px}.sheet .actions{display:flex;gap:10px;flex-wrap:wrap}.sheet .actions .btn{flex:1}@media(min-width:640px){.backdrop{align-items:center}.sheet{border-radius:34px;padding-bottom:26px}}@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}@keyframes rise{from{transform:translateY(60px) scale(.96);opacity:0}}@keyframes drop{to{transform:translateY(40px) scale(.97);opacity:0}}.preview{display:flex;justify-content:center;padding:6px 0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%) scale(.9);opacity:0;pointer-events:none;z-index:80;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:800;text-align:center;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .25s}.toast.show{transform:translate(-50%,0) scale(1);opacity:1}
@media(max-width:420px){.ob-title{font-size:34px}.big{font-size:38px}.em{font-size:19px}.lbrow{gap:9px;padding-right:16px}.val{font-size:18px}}

/* socials */
.home-actions{display:flex;align-items:center;gap:8px;flex:none}
.social-dock{display:flex;align-items:center;justify-content:flex-end;gap:8px;max-width:52px;overflow:hidden;transition:max-width .48s cubic-bezier(.22,1,.36,1)}
.social-dock.open{max-width:160px}
.social-main,.social-mini{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);box-shadow:var(--shadow)}
.social-main{background:var(--primary);color:var(--primary-ink)}
.social-mini{opacity:0;transform:translateX(18px) scale(.82);pointer-events:none;transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.4,.64,1),background-color .3s ease}
.social-dock.open .social-mini{opacity:1;transform:none;pointer-events:auto}
.social-mini:hover{background:var(--surface2)}
.social-main svg,.social-mini svg{width:21px;height:21px}
.notif-wrap{position:relative}
.notif-count{position:absolute;right:-2px;top:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--danger);color:#fff;font-size:10px;font-weight:900;line-height:1;box-shadow:0 4px 8px -3px var(--danger);border:2px solid var(--surface)}
.notif-count[hidden]{display:none!important}
.social-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.social-sheet-head h2{margin:0}
.social-search{display:flex;gap:9px;align-items:center}
.social-search .field{flex:1;min-width:0}
.social-search-btn{width:52px;height:52px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.social-section{display:flex;flex-direction:column;gap:10px}
.social-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.social-section-title h3{font-size:18px}
.people-list{display:flex;flex-direction:column;gap:10px}
.person-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:11px;padding:11px 12px;border-radius:24px;background:var(--surface2)}
.person-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 14px -10px var(--c)}
.person-main{min-width:0}
.person-name{font-weight:900;display:flex;align-items:center;gap:6px;min-width:0}
.person-name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-username{font-size:12px;color:var(--muted);font-weight:800}
.person-meta{font-size:12px;color:var(--muted);font-weight:800;margin-top:1px}
.follow-btn{padding:9px 13px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:900;font-size:13px;white-space:nowrap}
.follow-btn.following{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.social-empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px}
.social-loader{padding:16px;text-align:center;color:var(--muted);font-weight:800}
.notifications-list{display:flex;flex-direction:column;gap:10px}
.notification-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:11px;padding:13px;border-radius:24px;background:var(--surface2);position:relative}
.notification-row.unread{box-shadow:0 0 0 2px var(--primary) inset}
.notification-icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface)}
.notification-copy{min-width:0;padding-right:4px}
.notification-title{font-weight:900;font-size:15px}
.notification-body{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.notification-time{font-size:11px;color:var(--muted);font-weight:800;margin-top:6px}
.unread-dot{position:absolute;right:12px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.social-markread{font-size:13px;color:var(--primary);font-weight:900;padding:7px 10px;border-radius:999px;background:var(--surface2)}
.social-divider{height:1px;background:var(--line);margin:2px 0}
@media(max-width:420px){.social-dock.open{max-width:156px}.social-main,.social-mini{width:44px;height:44px}.person-row{grid-template-columns:42px minmax(0,1fr) auto}.person-av{width:42px;height:42px}}

    if(v2&&v1){
      /* Prefer an already-completed setup with actual subjects/progress. */
      if(v2.onboarded&&!v1.onboarded)return v2;
      if(v1.onboarded&&!v2.onboarded)return v1;
      var score2=v2.subjects.length+(Object.keys(v2.log).length?2:0)+(v2.xp>0?2:0);
      var score1=v1.subjects.length+(Object.keys(v1.log).length?2:0)+(v1.xp>0?2:0);
      if(score1>score2)return v1;
      if(score2>score1)return v2;
      return v2.updatedAt>=v1.updatedAt?v2:v1;
    }
    if(v2)return v2;
    if(v1)return v1;
  }catch(e){}

/* ---------- socials ---------- */
function socialDock(){
  var dock=h('div',{class:'social-dock',id:'socialDock'});
  var notifBadge=h('span',{class:'notif-count',hidden:unreadNotifications()<=0});
  notifBadge.textContent=unreadNotifications()>99?'99+':String(unreadNotifications());

  var notif=h('button',{class:'social-mini notif-wrap',title:'Notifications','aria-label':'Notifications',onclick:function(e){e.stopPropagation();openSocialNotifications();}},icon('bell',22));
  notif.append(notifBadge);

  var search=h('button',{class:'social-mini',title:'Search people','aria-label':'Search people',onclick:function(e){e.stopPropagation();openSocialSearch();}},icon('search',22));
  var main=h('button',{class:'social-main press',title:'Socials','aria-label':'Open socials',onclick:function(e){
    e.stopPropagation();
    dock.classList.toggle('open');
  }},icon('users',22));

  dock.append(search,notif,main);

  setTimeout(function(){
    document.addEventListener('click',function onDoc(e){
      if(!dock.contains(e.target)){
        dock.classList.remove('open');
        document.removeEventListener('click',onDoc);
      }
    });
  },0);

  return dock;
}

function safeSearchTerm(v){
  return String(v||'').trim().toLowerCase().replace(/[%_]/g,'');
}

async function getFollowingIds(){
  if(!accountConnected())return [];
  var r=await sb.from('tt_follows').select('following_id').eq('follower_id',UID);
  if(r.error)throw r.error;
  return (r.data||[]).map(function(x){return x.following_id;});
}

async function refreshFollowing(){
  try{
    socialFollowing=new Set(await getFollowingIds());
  }catch(e){
    console.warn('Following load failed:',e);
    socialFollowing=new Set();
  }
}

function personRow(person,following,refresh){
  var row=h('div',{class:'person-row'});
  var av=h('div',{class:'person-av bub',vars:bubVars(safeColor(person.color)||COLORS[6])},person.emoji||'🙂');
  var main=h('div',{class:'person-main'},
    h('div',{class:'person-name'},h('span',null,person.name||'Student')),
    h('div',{class:'person-username'},'@'+cleanUsername(person.username||'')),
    h('div',{class:'person-meta'},'Level '+(person.level||levelOf(num(person.xp)))+' · '+fmtXp(num(person.xp))+' XP')
  );
  var btn=h('button',{class:'follow-btn'+(following?' following':''),onclick:async function(){
    if(!accountConnected()){toast('Create an account to follow people.');return;}
    btn.disabled=true;
    try{
      if(following){
        var d=await sb.from('tt_follows').delete().eq('follower_id',UID).eq('following_id',person.user_id||person.id);
        if(d.error)throw d.error;
        socialFollowing.delete(person.user_id||person.id);
      }else{
        var ins=await sb.from('tt_follows').insert({follower_id:UID,following_id:person.user_id||person.id});
        if(ins.error)throw ins.error;
        socialFollowing.add(person.user_id||person.id);
        initializeSocialSeen(person.user_id||person.id,person);
      }
      touch(false);
      refresh();
    }catch(e){
      console.error('Follow error:',e);
      toast(e&&e.message?e.message:'Could not update your following list.');
      btn.disabled=false;
    }
  }},following?'Following':'Follow');
  row.append(av,main,btn);
  return row;
}

function initializeSocialSeen(id,person){
  if(!S.socialSeen)S.socialSeen={};
  if(S.socialSeen[id])return;
  S.socialSeen[id]={
    level:typeof person.level==='number'?person.level:levelOf(num(person.xp)),
    badges:Array.isArray(person.badges)?person.badges.slice():[],
    initializedAt:new Date().toISOString()
  };
}

async function searchSocialAccounts(term){
  term=safeSearchTerm(term);
  if(!term)return [];
  var q=sb.from('tt_board').select('user_id,username,name,emoji,color,xp,level,badges,total').ilike('username','%'+term+'%').neq('user_id',UID).limit(20);
  var r=await q;
  if(r.error)throw r.error;
  return r.data||[];
}

async function openSocialSearch(){
  if(!accountConnected()){
    openSheet(function(sheet){
      sheet.append(
        h('h2',null,'Socials'),
        h('p',{class:'muted'},'Create or log into an account to search for usernames and follow people.'),
        h('div',{class:'actions'},
          h('button',{class:'btn ghost press',onclick:function(){closeSheet();}},'Close'),
          h('button',{class:'btn press',onclick:function(){closeSheet();setTimeout(function(){openSyncSheet('login');},230);}},'Log in')
        )
      );
    });
    return;
  }

  await refreshFollowing();

  openSheet(function(sheet){
    var results=h('div',{class:'people-list'});
    var followingBox=h('div',{class:'people-list'});
    var err=h('p',{class:'err',role:'alert'});
    var input=h('input',{class:'field',type:'text',maxlength:20,placeholder:'Search @username',autocomplete:'off','aria-label':'Search usernames'});

    function drawFollowing(){
      followingBox.replaceChildren();
      var arr=Array.from(socialFollowing);
      if(!arr.length){followingBox.append(h('p',{class:'social-empty'},'You are not following anyone yet.'));return;}
      var people=arr.map(function(id){return lbDocs.get(id);}).filter(Boolean).map(function(p){return Object.assign({user_id:p.user_id||null},p);});
      if(!people.length){followingBox.append(h('p',{class:'social-empty'},'You are not following anyone yet.'));return;}
      people.forEach(function(p){
        var id=p.user_id;
        if(!id){
          var match=Array.from(lbDocs.entries()).find(function(x){return x[1]===p;});
          id=match?match[0]:'';

async function detectSocialActivity(){
  if(!accountConnected())return false;
  var changed=false;

  try{
    await refreshFollowing();

    socialFollowing.forEach(function(id){
      var p=lbDocs.get(id);
      if(!p)return;
      if(!S.socialSeen[id]){
        initializeSocialSeen(id,{level:p.level,badges:p.badges});
        changed=true;
        return;
      }

      var seen=S.socialSeen[id];
      var oldLevel=typeof seen.level==='number'?seen.level:levelOf(num(p.xp));
      var newLevel=typeof p.level==='number'?p.level:levelOf(num(p.xp));
      var oldBadges=Array.isArray(seen.badges)?seen.badges:[];
      var newBadges=Array.isArray(p.badges)?p.badges:[];

      if(newLevel>oldLevel){
        for(var level=oldLevel+1;level<=newLevel;level++){
          if(level%5===0){
            var nid='level-'+id+'-'+level;
            if(pushNotification({id:nid,type:'level',actorId:id,actorName:p.name,actorEmoji:p.emoji,actorColor:p.color,title:(p.name||'Someone')+' reached level '+level,body:'They have reached a new 5-level milestone.'}))changed=true;
          }
        }
        seen.level=newLevel;
        changed=true;
      }

      newBadges.forEach(function(bid){
        if(oldBadges.indexOf(bid)===-1){
          var def=badgeDef(bid);
          var nid='badge-'+id+'-'+bid;
          if(pushNotification({id:nid,type:'badge',actorId:id,actorName:p.name,actorEmoji:p.emoji,actorColor:p.color,title:(p.name||'Someone')+' earned a badge',body:def?(def.emoji+' '+def.name):'A new badge was earned.'}))changed=true;
        }
      });

      seen.badges=newBadges.slice();
    });

    var u=await sb.from('tt_site_updates').select('id,title,body,created_at').eq('active',true).order('created_at',{ascending:false}).limit(20);
    if(!u.error){
      var updates=u.data||[];
      var newest=updates.length?updates[0].created_at:'';
      if(!S.siteSeenAt){
        S.siteSeenAt=newest||new Date().toISOString();
      }else{
        updates.slice().reverse().forEach(function(up){
          if(up.created_at>S.siteSeenAt){
            var nid='site-'+up.id;
            if(pushNotification({id:nid,type:'update',title:'Timetracker was updated',body:(up.title||'A new update is available')+(up.body?' · '+up.body:''),createdAt:up.created_at}))changed=true;
          }
        });
        if(newest>S.siteSeenAt){S.siteSeenAt=newest;changed=true;}
      }
    }

    if(changed){
      localSave();
      scheduleSave(false);
      paintNotificationBadge();
    }
  }catch(e){
    console.warn('Social activity check failed:',e);
  }

  return changed;
}
